<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finish Strong</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="certificate">
  <div class="container">
    <div class="app-container">
      <section class="page-hero glass-panel" data-shell-page-hero></section>

      <label for="nameInput">
        <i class="fa-solid fa-user"></i> Enter your name:
      </label>
      <input type="text" id="nameInput" placeholder="Enter your name" />
      <button onclick="generateCertificate()">
        <i class="fa-solid fa-award"></i> Finish Strong
      </button>

      <div id="certificateOutput" class="certificate glass-card" style="display: none;"></div>
      <div class="nav-bar" data-shell-nav data-next-id="nextButton"></div>
    </div>
  </div> <!-- close .app-container -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/pages/certificate.js"></script>
</body>
</html>
